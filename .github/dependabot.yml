version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
    ignore:
      # Biblioteca não oficial do WhatsApp: atualizar só manualmente, testando o envio de verdade.
      - dependency-name: '@whiskeysockets/baileys'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
