# Limita os logs de cada contêiner a 3 arquivos de 10 MB, para não encher o disco da VM.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    # A imagem é compilada na própria máquina: docker compose up -d --build
    image: aniversarios:local
    build: .
    restart: unless-stopped
    env_file: .env
    init: true # repassa sinais e recolhe processos órfãos (o Node não é um bom PID 1)
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./storage:/app/storage
    mem_limit: 600m
    expose:
      - '3000'
    logging: *logging

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMINIO: ${DOMINIO}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
