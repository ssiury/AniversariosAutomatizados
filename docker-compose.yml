# Limita os logs de cada contêiner a 3 arquivos de 10 MB, para não encher o disco da VM.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/app/storage
    mem_limit: 600m
    expose:
      - '3000'
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
